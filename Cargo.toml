[workspace]
resolver = "3"
members = ["crates/*"]
# Fuzz targets build with nightly and cargo-fuzz only (`just fuzz`, ADR-088).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
leaf-core = { path = "crates/leaf-core" }
leaf-model = { path = "crates/leaf-model" }
leaf-editor = { path = "crates/leaf-editor" }
leaf-store = { path = "crates/leaf-store" }
leaf-export = { path = "crates/leaf-export" }
leaf-search = { path = "crates/leaf-search" }
leaf-fetch = { path = "crates/leaf-fetch" }
leaf-fixtures = { path = "crates/leaf-fixtures" }
leaf-bench = { path = "crates/leaf-bench" }
leaf-ui = { path = "crates/leaf-ui" }
# UI: gpui-component pins gpui exactly (published as `gpui-pre`), so we pin both to the same pair.
# Upgrade them together, deliberately. See docs/adr for the spike findings.
# gpui-platform features: runtime_shaders (no Xcode Metal Toolchain needed), font-kit (without it macOS draws
# no text), x11 + wayland (Linux windowing backends are opt-in).
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-component = "=0.8.1"
# Icons used by gpui-component widgets (checkbox tick, etc.); pinned with it.
gpui-kit-assets = "=0.8.1"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["runtime_shaders", "font-kit", "x11", "wayland"] }
loro = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Grapheme and word boundaries (UAX #29) for cursor movement; pure Rust, wasm-ok.
unicode-segmentation = "1.12"
# Emoji list, names, groups and shortcodes for the page icon picker; pure data, no required deps, wasm-ok.
emojis = "0.9.1"
anyhow = "1"
# App icon: PNG decoding for the Linux (X11) window icon, and embedding the icon into leaf.exe on Windows.
# Both are already in the tree through gpui.
image = { version = "0.25", default-features = false, features = ["png"] }
embed-resource = "3"
tracing = "0.1"
# XML parser to check an SVG before GPUI draws it (ADR-078). The same version usvg uses inside
# GPUI, so no new crate; pure Rust, no dependencies.
roxmltree = "0.21"
# Local time zone offset for the top bar's "edited" hover time (E18-S03). Already in the tree through
# gpui-component (with its `clock` feature); no new crate.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Web bookmark previews (E15-S05, ADR-080), in leaf-fetch only. ureq: a small blocking HTTP client with rustls and
# Mozilla's root certificates; pinned exactly because the resolver hook that refuses local-network addresses is in its
# semver-exempt `unversioned` module. html5ever: the HTML tokenizer gpui-component already brings, same version.
# url and encoding_rs are already in the tree through GPUI.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "gzip"] }
html5ever = "=0.27.0"
url = "2.5"
encoding_rs = "0.8"
# dev
proptest = "1"
insta = "1"
pretty_assertions = "1"
# Benchmarks for the performance budgets (E08-S02); dev-only, in leaf-bench.
divan = "0.1.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Hidden panics and smells (E08-S15, ADR-XXX-E08-S15). Core crates also lint indexing and arithmetic, in their
# `lib.rs`. Tests may panic, index and print (clippy.toml); examples and benches may print.
allow_attributes_without_reason = "warn"
panic = "warn"
unreachable = "warn"
print_stdout = "warn"
print_stderr = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# Development and test builds keep only line tables (file and line in panics and backtraces), not full debug info:
# linking is faster and `target/` far smaller (E08-S17). For a debugger session, build with
# `CARGO_PROFILE_DEV_DEBUG=full`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
# Dependencies are optimised and need no debug info at all.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
