[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail for every crate. "Unmaintained" notices only fail for crates we depend on directly:
# GPUI pulls in several unmaintained crates we cannot replace (see the GPUI ADR).
unmaintained = "workspace"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "BSL-1.0",
  "0BSD", # enum-iterator, via gpui-component
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; they are never published (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "warn"
