name: Bug report
description: Something in Leaf doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search the [existing issues](https://github.com/milinpaul/project-leaf/issues) first.
        For security problems, use [private reporting](https://github.com/milinpaul/project-leaf/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a new page
        2. Type `- ` then some text
        3. Press Enter twice
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Leaf version
      description: The commit you built from (`git rev-parse --short HEAD`), or Settings → About.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, logs, or whether any text was lost.
