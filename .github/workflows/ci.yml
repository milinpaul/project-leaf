name: CI

on:
  push:
    branches: [main]
  pull_request:
  # "Run workflow" in the Actions tab: full three-OS test matrix on any branch, e.g. for platform changes.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every main run finish: main is where all three OSes get tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Core crates measured by the coverage gate (UI crates are excluded).
  UI_CRATES: "--exclude leaf-ui --exclude leaf-app"

jobs:
  backlog:
    name: Backlog valid and JSON in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/backlog.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'

  lint:
    name: Format, clippy, typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Linux system deps (GPUI)
        run: ./.github/scripts/linux-deps.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: crate-ci/typos@v1

  deps:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  test:
    name: Test (${{ matrix.os }})
    # Not on pull requests, to keep them fast: core-crate tests still run there inside the coverage job, and the
    # pre-push hook runs everything locally. Pushes to main and manual runs test on all three OSes.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      # The long property-test run (E02-S07): 10,000 random command sequences per property instead of 256.
      PROPTEST_CASES: "10000"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Linux system deps (GPUI)
        if: runner.os == 'Linux'
        run: ./.github/scripts/linux-deps.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked

  wasm:
    name: WASM check (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown -p leaf-core -p leaf-model -p leaf-editor

  coverage:
    name: Coverage (≥ 90% core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - name: Linux system deps (GPUI)
        run: ./.github/scripts/linux-deps.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Coverage gate
        run: |
          cargo llvm-cov nextest --workspace $UI_CRATES --locked \
            --fail-under-lines 90 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
