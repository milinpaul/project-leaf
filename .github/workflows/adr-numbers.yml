name: ADR numbers

# A new decision record is `docs/adr/ADR-XXX-<story>-<title>.md` on its branch. Once it reaches main, this gives it
# the next free number and updates every mention, so two branches can never take the same number (E00-S12).
on:
  push:
    branches: [main]
    paths: ["docs/adr/ADR-XXX-*"]
  # "Run workflow" in the Actions tab, if a run was ever missed.
  workflow_dispatch:

# Read-only unless a job asks for more (ADR-073); the numbering job asks to push its one commit.
permissions:
  contents: read

# One numbering at a time, never cancelled: two merges close together are numbered one after the other.
concurrency:
  group: adr-numbers
  cancel-in-progress: false

jobs:
  number:
    name: Number new ADRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Number and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another merge can land while this runs: start again from the newest main, up to three times.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/adr_number.py
            git add -A
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Number new ADRs (E00-S12)"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "could not push after three attempts" >&2
          exit 1
